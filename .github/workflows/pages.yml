# Build the site and publish it to GitHub Pages on every push to main.
#
# The download button points at the Iteration-CFD release, so this workflow
# builds nothing but the page itself. To send beta signups somewhere, set the
# repository variable SIGNUP_ENDPOINT; without it the form still works and the
# address is recorded on the visitor's device only.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint
      - run: npm run build
        env:
          VITE_SIGNUP_ENDPOINT: ${{ vars.SIGNUP_ENDPOINT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
